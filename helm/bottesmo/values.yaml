replicaCount: 1

image:
  registry: docker.io
  repository: bnoleau/bottesmo
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

env:
  PORT: "3102"
  # DICT_WORDS_SOURCE: ""
  # DICT_WORDS_FULL_SOURCE: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3102
  sessionAffinity: ClientIP

httproute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: bottesmo-gateway
      namespace: gateway
  hostnames:
    - bottesmo.local

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: bottesmo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /api/status
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/status
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /api/status
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}

strategy:
  type: Recreate
